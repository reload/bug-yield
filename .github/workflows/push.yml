on: push
name: Run tests
jobs:
  php_versions:
    name: Lookup PHP versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
    - uses: actions/checkout@master
    - name: Determine PHP versions from composer.json
      id: versions
      uses: antfroger/php-version-action@v1
  spec_tests:
    name: Spec tests
    needs: php_versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ${{ fromJSON(needs.php_versions.outputs.matrix) }}
    steps:
    - uses: actions/checkout@master
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@master
      with:
        php-version: ${{ matrix.php-version }}
        extensions: gmp
        coverage: xdebug
    - name: Install Dependencies
      run: |
        composer install --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Spec tests
      run: |
        php -d xdebug.mode=coverage ./vendor/bin/phpspec run
    - name: Upload coverage report to Codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        bash <(curl -s https://codecov.io/bash) -c -F spec -n Spec
